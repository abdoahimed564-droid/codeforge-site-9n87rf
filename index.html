<!DOCTYPE html>
<html lang="en">
<head><style>body{
  margin:0;
  font-family:system-ui;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  background:#111;
  color:#fff;
}
h1{
  margin:20px 0 10px;
}
#score{
  margin-bottom:10px;
  font-size:1.2rem;
}
#gameCanvas{
  width:100%;
  max-width:600px;
  aspect-ratio:1/1;
  background:#222;
  border:2px solid #444;
  border-radius:8px;
}
#jumpScare{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:3rem;
  z-index:9999;
  pointer-events:none;
}</style>
<meta charset="UTF-8">
<title>Snake Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Snake Game</h1>
<p id="score">Score: 0</p>
<canvas id="gameCanvas"></canvas>
<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');

  let gridSize = 20; // size of each cell in pixels
  let tileCount = 30; // number of cells per side
  let tileSize = gridSize - 2; // size of snake/food inside cell

  // Resize canvas to fit tileCount * gridSize
  function resizeCanvas() {
    canvas.width = tileCount * gridSize;
    canvas.height = tileCount * gridSize;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Snake state
  let snake = [{x: 10, y: 10}];
  let velocity = {x: 0, y: 0};
  let food = {x: 5, y: 5};
  let score = 0;
  let gameOver = false;

  // Place food at random location
  function placeFood() {
    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);
    // Avoid placing food on snake
    if (snake.some(seg => seg.x === food.x && seg.y === food.y)) {
      placeFood();
    }
  }
  placeFood();

  // Draw everything
  function draw() {
    // Clear canvas
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw food
    ctx.fillStyle = '#ff3b3b';
    ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, tileSize, tileSize);

    // Draw snake
    ctx.fillStyle = '#4caf50';
    snake.forEach((seg, index) => {
      ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, tileSize, tileSize);
    });

    // Update snake position
    const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

    // Wrap around edges
    if (head.x < 0) head.x = tileCount - 1;
    if (head.x >= tileCount) head.x = 0;
    if (head.y < 0) head.y = tileCount - 1;
    if (head.y >= tileCount) head.y = 0;

    // Check collision with self (skip the current head)
    if (snake.slice(1).some(seg => seg.x === head.x && seg.y === head.y)) {
      gameOver = true;
      return;
    }

    // Add new head
    snake.unshift(head);

    // Check food collision
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = `Score: ${score}`;
      placeFood();
    } else {
      // Remove tail
      snake.pop();
    }
  }

  // Handle keyboard input
  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'w':
        if (velocity.y !== 1) velocity = {x: 0, y: -1};
        break;
      case 's':
        if (velocity.y !== -1) velocity = {x: 0, y: 1};
        break;
      case 'a':
        if (velocity.x !== 1) velocity = {x: -1, y: 0};
        break;
      case 'd':
        if (velocity.x !== -1) velocity = {x: 1, y: 0};
        break;
    }
  });

  // Game loop
  function gameLoop() {
    if (!gameOver) {
      draw();
      requestAnimationFrame(gameLoop);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '24px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('خسرت', canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = '18px system-ui';
      ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
      ctx.fillText('Press R to Restart', canvas.width / 2, canvas.height / 2 + 40);
    }
  }
  requestAnimationFrame(gameLoop);

  // Restart on 'R'
  document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r' && gameOver) {
      snake = [{x: 10, y: 10}];
      velocity = {x: 0, y: 0};
      score = 0;
      scoreEl.textContent = 'Score: 0';
      gameOver = false;
      placeFood();
      requestAnimationFrame(gameLoop);
    }
  });

  /* --- Jump Scare Feature --- */
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playLoudBeep() {
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(2000, audioCtx.currentTime); // 2kHz for a sharper tone
    gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime); // maximum volume
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 1.0); // 1 second beep
  }

  function triggerJumpScare() {
    // Create overlay if not exists
    let overlay = document.getElementById('jumpScare');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'jumpScare';
      overlay.textContent = 'SURPRISE!';
      document.body.appendChild(overlay);
    }
    overlay.style.display = 'flex';
    playLoudBeep();
    // Hide after 3 seconds
    setTimeout(() => {
      overlay.style.display = 'none';
    }, 3000);
  }

  // Expose global function for console
  window.hi = function() {
    triggerJumpScare();
  };
});
</script></body>
</html>
